<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Returning to Cadence</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f0f10; color: #f2f2f2;
         font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-align: center; }
  a { display: inline-block; margin-top: 16px; padding: 12px 22px; border-radius: 999px; background: #FFC72C;
      color: #111; font-weight: 600; text-decoration: none; }
  p { color: #a8a8a8; margin: 6px 0 0; }
</style>
</head>
<body>
<main>
  <h1>Returning to Cadence…</h1>
  <p>Zoom is connected. If Cadence doesn't open by itself, tap the button.</p>
  <a id="back" href="cadence://oauth/zoom">Open Cadence</a>
</main>
<script>
  // Hands the Zoom sign-in code back to the Cadence app.
  var target = "cadence://oauth/zoom" + window.location.search;
  document.getElementById("back").href = target;
  window.location.replace(target);
</script>
</body>
</html>
